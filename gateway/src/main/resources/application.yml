server:
  port: 8080
  tomcat:
    threads:
      max: 1000
      min-spare: 50
    accept-count: 1000
    max-connections: 10000
    connection-timeout: 20000

gateway:
  servers: "http://localhost:8081,http://localhost:8082,http://localhost:8083"
  virtual-nodes: 150
  health-check:
    interval-millis: 5000
    timeout-millis: 2000
  rate-limit:
    enabled: true

logging:
  level:
    root: INFO
    com.banking: DEBUG
